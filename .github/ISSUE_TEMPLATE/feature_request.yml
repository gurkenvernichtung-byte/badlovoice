name: Feature request
description: Idea to make BadloVoice better for more people
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most
      options:
        - Phone / Simple users
        - Discord / streamers
        - RVC power users
        - Android
        - Everyone
    validations:
      required: true
