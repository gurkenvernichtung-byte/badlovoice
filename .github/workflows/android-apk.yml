

name: Build BadloVoice Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Space-separated single line; compileSdk is 36 (android/variables.gradle).
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync Android app
        working-directory: frontend
        run: npm run mobile:sync

      - name: Check Android project
        working-directory: frontend/android
        run: |
          test -f gradlew
          chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: badlovoice-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

