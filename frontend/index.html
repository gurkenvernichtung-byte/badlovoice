<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('badlovoice_layout_v2');
          var ua = navigator.userAgent || '';
          var likelyNative = /; wv\)/i.test(ua);
          var layout =
            saved === 'desktop' || saved === 'phone' || saved === 'auto'
              ? saved
              : likelyNative
                ? 'phone'
                : window.matchMedia('(min-width: 1024px)').matches
                  ? 'auto'
                  : 'phone';
          // Android WebView: never boot into pannable "auto"/desktop from old prefs.
          if (likelyNative && layout !== 'desktop') layout = 'phone';
          document.documentElement.setAttribute('data-layout', layout);
          localStorage.removeItem('badlovoice_layout');
        } catch (e) {
          document.documentElement.setAttribute('data-layout', 'phone');
        }
      })();
    </script>
    <meta
      name="description"
      content="BadloVoice — change your voice live. Simple pitch presets for phone and desktop."
    />
    <meta name="theme-color" content="#efe4d4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>Red Room Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
